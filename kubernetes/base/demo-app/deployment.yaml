
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web
  namespace: applications
  labels:
    app: demo-web
    app.kubernetes.io/part-of: atlas-platform

spec:
  replicas: 2

  selector:
    matchLabels:
      app: demo-web

  template:
    metadata:
      labels:
        app: demo-web

    spec:
      containers:
        - name: nginx
          image: nginx:1.29
          ports:
            - name: http
              containerPort: 80

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
